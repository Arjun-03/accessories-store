<a href="/products/{{ product.slug }}" class="group block">
  <div class="aspect-square bg-surface rounded-md overflow-hidden mb-4">
    {% if product.primary_image %}
    <img src="{{ product.primary_image.url }}"
         alt="{{ product.primary_image.alt_text or product.name }}"
         class="w-full h-full object-cover transition-transform duration-500 ease-out group-hover:scale-[1.04]">
    {% endif %}
  </div>
  <h3 class="text-sm text-ink mb-1">{{ product.name }}</h3>
  <p class="text-sm text-muted">
    {% if product.discount_price %}
    <span class="text-ink">Rs. {{ product.discount_price }}</span>
    <span class="line-through ml-1">Rs. {{ product.price }}</span>
    {% else %}
    Rs. {{ product.price }}
    {% endif %}
  </p>
</a>
