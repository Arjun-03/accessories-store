{% extends "base.html" %}
{% block title %}{% if product %}Edit{% else %}New{% endif %} Product — Admin{% endblock %}

{% block content %}
<div class="max-w-lg">
  <h1 class="text-2xl font-medium mb-8">{% if product %}Edit product{% else %}New product{% endif %}</h1>

  <form action="{% if product %}/admin/products/{{ product.id }}/edit{% else %}/admin/products/new{% endif %}"
        method="post" enctype="multipart/form-data" class="space-y-4">

    <input name="name" required placeholder="Product name" value="{{ product.name if product else '' }}"
           class="w-full border border-neutral-300 rounded px-3 py-2 text-sm">

    <select name="category_id" required class="w-full border border-neutral-300 rounded px-3 py-2 text-sm">
      {% for c in categories %}
      <option value="{{ c.id }}" {% if product and product.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
      {% endfor %}
    </select>

    <textarea name="description" placeholder="Description" rows="3"
              class="w-full border border-neutral-300 rounded px-3 py-2 text-sm">{{ product.description if product and product.description else '' }}</textarea>

    <div class="flex gap-4">
      <input name="price" type="number" step="0.01" min="0" required placeholder="Price"
             value="{{ product.price if product else '' }}"
             class="w-full border border-neutral-300 rounded px-3 py-2 text-sm">
      <input name="discount_price" type="number" step="0.01" min="0" placeholder="Discount price (optional)"
             value="{{ product.discount_price if product and product.discount_price else '' }}"
             class="w-full border border-neutral-300 rounded px-3 py-2 text-sm">
    </div>

    <input name="stock_quantity" type="number" min="0" required placeholder="Stock quantity"
           value="{{ product.stock_quantity if product else '' }}"
           class="w-full border border-neutral-300 rounded px-3 py-2 text-sm">

    <input name="sku" placeholder="SKU (optional)" value="{{ product.sku if product and product.sku else '' }}"
           class="w-full border border-neutral-300 rounded px-3 py-2 text-sm">

    <div>
      <label class="block text-sm text-neutral-600 mb-1">Product image</label>
      <input name="image" type="file" accept="image/*" class="text-sm">
    </div>

    <button type="submit"
            class="bg-neutral-900 text-white text-sm px-6 py-3 rounded-full hover:bg-neutral-700">
      {% if product %}Save changes{% else %}Create product{% endif %}
    </button>
  </form>
</div>
{% endblock %}
