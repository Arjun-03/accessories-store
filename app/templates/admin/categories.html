{% extends "base.html" %}
{% block title %}Categories — Admin{% endblock %}

{% block content %}
<div class="flex justify-between items-center mb-8">
  <h1 class="text-2xl font-medium">Categories</h1>
  <a href="/admin" class="text-sm text-neutral-500 hover:text-neutral-900">← Dashboard</a>
</div>

<form action="/admin/categories/new" method="post" class="flex gap-2 mb-8 max-w-lg">
  <input name="name" required placeholder="New category name"
         class="flex-1 border border-neutral-300 rounded px-3 py-2 text-sm">
  <button class="bg-neutral-900 text-white text-sm px-4 py-2 rounded-full hover:bg-neutral-700">Add</button>
</form>

{% if categories %}
<ul class="space-y-2 max-w-lg">
  {% for c in categories %}
  <li class="flex justify-between text-sm border-b border-neutral-100 py-2">
    <span>{{ c.name }}</span>
    <span class="text-neutral-400">{{ c.slug }}</span>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="text-neutral-500">No categories yet. Add one above.</p>
{% endif %}
{% endblock %}
