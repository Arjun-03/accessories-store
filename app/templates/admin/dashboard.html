{% extends "base.html" %}
{% block title %}Admin{% endblock %}
{% block content %}
<div class="flex justify-between items-center mb-8">
  <h1 class="text-2xl font-medium">Admin Dashboard</h1>
  <form action="/admin/logout" method="post">
    <button class="text-sm text-neutral-500 hover:text-neutral-900">Log out</button>
  </form>
</div>
<div class="mt-6 space-y-2">
  <a href="/admin/orders" class="block text-sm underline hover:text-neutral-600">Manage orders →</a>
  <a href="/admin/products" class="block text-sm underline hover:text-neutral-600">Manage products →</a>
  <a href="/admin/categories" class="block text-sm underline hover:text-neutral-600">Manage categories →</a>
</div>
<p class="text-neutral-600">Logged in as {{ admin.email }}.</p>
{% endblock %}
