{% extends "base.html" %}
{% block title %}Edit category — Admin{% endblock %}

{% block content %}
<div class="max-w-lg">
  <h1 class="font-serif text-2xl text-ink mb-8">Edit category</h1>

  <form action="/admin/categories/{{ category.id }}/edit" method="post"
        enctype="multipart/form-data" class="space-y-4">
    <input name="name" required value="{{ category.name }}"
           class="w-full border border-line rounded-md px-3 py-2 text-sm">

    {% if category.image_url %}
    <div class="w-32 h-40 bg-surface rounded-md overflow-hidden">
      <img src="{{ category.image_url }}" alt="{{ category.name }}" class="w-full h-full object-cover">
    </div>
    <p class="text-xs text-muted">Upload a new image to replace the current one.</p>
    {% endif %}

    <input name="image" type="file" accept="image/*"
           class="text-sm text-muted file:mr-4 file:cursor-pointer file:rounded-full file:border-0
                  file:bg-surface file:px-4 file:py-2 file:text-ink file:text-sm hover:file:bg-line transition-colors">

    <button class="bg-accent text-background text-sm px-6 py-3 rounded-full hover:bg-accent-hover transition-colors cursor-pointer">
      Save changes
    </button>
  </form>
</div>
{% endblock %}
