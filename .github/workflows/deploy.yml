name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: accessories-store
  ECS_SERVICE: accessories-store

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (tagged with commit SHA)
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        env:
          SUBNETS: "subnet-0685ae1f22b3734d2,subnet-0224884e27faf1db5,subnet-0c3a18425e4bc75b7"
          SECURITY_GROUPS: "sg-05ff30ed07e89e61a,sg-00c3d9acf6b395d69"
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster default \
            --task-definition default-accessories-store \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"Main","command":["alembic","upgrade","head"]}]}' \
            --region $AWS_REGION \
            --query "tasks[0].taskArn" --output text)

          echo "Migration task: $TASK_ARN"
          echo "Waiting for migration to complete..."
          aws ecs wait tasks-stopped --cluster default --tasks "$TASK_ARN" --region $AWS_REGION

          EXIT_CODE=$(aws ecs describe-tasks --cluster default --tasks "$TASK_ARN" --region $AWS_REGION \
            --query "tasks[0].containers[0].exitCode" --output text)

          echo "Migration exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed — aborting deploy."
            exit 1
          fi
          echo "Migration succeeded."

      - name: Deploy to ECS Express Mode
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.ECS_SERVICE }}
          image: ${{ steps.build.outputs.image }}
          execution-role-arn: ${{ secrets.AWS_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ secrets.AWS_INFRASTRUCTURE_ROLE_ARN }}
